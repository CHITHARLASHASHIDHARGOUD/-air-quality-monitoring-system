# ===============================================
# Urban Air Quality Monitoring - Configuration
# ===============================================

# Application Info
spring.application.name=Air Quality Monitoring System
server.port=8080

# ===============================================
# Database Configuration - MySQL
# ===============================================
# Active profile: MySQL (persistent)
spring.datasource.url=jdbc:mysql://localhost:3306/air_quality_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:aqi_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# H2 Database (Alternative for Development/Testing)
# ===============================================
# Using H2 in-memory database for easy testing
#spring.datasource.url=jdbc:h2:mem:airqualitydb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Disable schema.sql for H2 (let JPA create schema from entities)
spring.sql.init.mode=never

# ===============================================
# Data Simulation Configuration
# ===============================================
# Enable/disable simulated data generation
airquality.simulation.enabled=false
# How often to generate new data (milliseconds)
airquality.simulation.interval=30000
# Maximum records to keep in database
airquality.simulation.max-records=100

# Scheduled real city data collection
airquality.collection.enabled=true
airquality.collection.city=Hyderabad
airquality.collection.interval=60000
airquality.collection.initial-delay=5000

# ===============================================
# Alert Configuration
# ===============================================
# Enable/disable alert checking
airquality.alert.enabled=true
# Alert check interval (milliseconds)
airquality.alert.check-interval=30000

# ===============================================
# CORS Configuration
# ===============================================
# Allow frontend to connect (configure as needed)
airquality.cors.allowed-origins=*
airquality.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
airquality.cors.allowed-headers=*
airquality.cors.allow-credentials=false

# ===============================================
# Logging Configuration
# ===============================================
logging.level.root=INFO
logging.level.com.airquality=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ===============================================
# Actuator Configuration (Health Monitoring)
# ===============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================================
# Email Configuration
# ===============================================
# Configure your SMTP credentials below.
# For Gmail: enable 2FA and generate an App Password
# at https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@example.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
airquality.email.enabled=true

# ===============================================
# External API Configuration (For Future Use)
# ===============================================
# Configure when integrating with real AQI API
#airquality.api.key=your-api-key-here
#airquality.api.url=https://api.openaq.org/v2/latest
#airquality.api.timeout=5000

# ===============================================
# Weather API Configuration (OpenWeatherMap)
# ===============================================
# OpenWeatherMap API key
weather.api.key=${WEATHER_API_KEY:your_openweathermap_api_key}
# API base URL
weather.api.url=https://api.openweathermap.org/data/2.5/weather
# Default city for weather data
weather.api.city=London
# Units: metric (Celsius), imperial (Fahrenheit), standard (Kelvin)
weather.api.units=metric
# API timeout (milliseconds)
weather.api.timeout=5000

# ===============================================
# Air Pollution API Configuration (OpenWeatherMap)
# ===============================================
# OpenWeatherMap Air Pollution API key (same as weather key)
airpollution.api.key=${AIRPOLLUTION_API_KEY:your_openweathermap_api_key}
# Air Pollution API base URL
airpollution.api.url=https://api.openweathermap.org/data/2.5/air_pollution
