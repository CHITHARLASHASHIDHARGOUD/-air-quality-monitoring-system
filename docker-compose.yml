version: "3.8"

services:
  # Air Quality Backend Service
  air-quality-backend:
    build:
      context: ./air-quality-backend
      dockerfile: Dockerfile
    container_name: air-quality-backend
    ports:
      - "8080:8080"
    environment:
      # Database Configuration (MySQL persistent)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/air_quality_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: aqi_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change_me}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: never

      # Weather API
      WEATHER_API_KEY: ${WEATHER_API_KEY:-your_openweathermap_api_key}

      # Air Quality Simulation
      AIRQUALITY_SIMULATION_ENABLED: "true"
      AIRQUALITY_SIMULATION_INTERVAL: 30000
      AIRQUALITY_SIMULATION_MAX_RECORDS: 100

      # Alert Configuration
      AIRQUALITY_ALERT_ENABLED: "true"
      AIRQUALITY_ALERT_CHECK_INTERVAL: 30000

      # CORS (adjust for your frontend domain)
      AIRQUALITY_CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080

      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    networks:
      - air-quality-network

  mysql:
    image: mysql:8.0
    container_name: air-quality-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: air_quality_db
      MYSQL_USER: aqi_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - air-quality-network

  # Nginx Web Server (serves frontend)
  nginx:
    image: nginx:alpine
    container_name: air-quality-nginx
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./air2.html:/usr/share/nginx/html/air2.html:ro
    depends_on:
      - mysql
      - air-quality-backend
    restart: unless-stopped
    networks:
      - air-quality-network

networks:
  air-quality-network:
    driver: bridge

# Volumes for MySQL (if using MySQL)
volumes:
  mysql-data:
